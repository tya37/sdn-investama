name: Update data
on:
  schedule:
    - cron: "0 */3 * * *"   # tiap 3 jam
  workflow_dispatch:         # tombol "Run workflow" manual
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - name: Simpan jika ada perubahan
        run: |
          git config user.name "sdn-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update data otomatis" && git push)
